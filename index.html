<!-- Adsgram Script Integration -->
<script src="https://sad.adsgram.ai/js/sad-index.js"></script>

<script>
    // Adsgram Ad Controller Setup
    const AdController = window.Adsgram.init({ 
        blockId: "YOUR_BLOCK_ID" // এখানে আপনার আসল ব্লক আইডি বসবে
    });

    // প্লেয়ার গেমের বোনাস/কয়েন নেওয়ার জন্য যখন এড দেখবে
    function showRewardAd() {
        AdController.show().then((result) => {
            // অ্যাড সফলভাবে সম্পূর্ণ দেখলে প্লেয়ার পুরষ্কার পাবে এবং আপনার ইনকাম জমা হবে
            alert("অভিনন্দন! আপনি ৫০টি বোনাস কয়েন পেয়েছেন 🪙");
            totalCoins += 50;
            document.getElementById('coin-count').innerText = totalCoins;
        }).catch((result) => {
            // অ্যাড না দেখলে বা কোনো সমস্যা হলে
            alert("বিজ্ঞাপনটি সম্পূর্ণ দেখা হয়নি, তাই কয়েন পাওয়া যায়নি।");
        });
    }
</script>
