<body>

  <!-- MAIN MENU SCREEN -->
  <div id="main-menu" class="screen active-screen">
    <div class="logo-badge">AS</div>
    <h1>AS BUS SIMULATOR</h1>
    <p class="welcome-text" id="welcome-msg">Welcome to 3D Bangladesh Highway</p>
    
    <div class="player-card" id="player-display">
      <i class="fa-solid fa-user"></i> Driver: <span id="p-name">Guest</span> | 
      <i class="fa-solid fa-coins" style="color:#f1c40f;"></i> <span id="p-coins">0</span>
    </div>

    <button class="start-btn" onclick="startBusGame()">
      <i class="fa-solid fa-bus"></i> START DRIVE
    </button>
  </div>

  <!-- GAMEPLAY HUD OVERLAY -->
  <div id="game-screen" class="screen">
    <div class="hud-top">
      <button class="back-btn" onclick="exitToMenu()"><i class="fa-solid fa-arrow-left"></i> Exit</button>
      <div class="hud-pill">
        <i class="fa-solid fa-layer-group"></i> Level: <span id="level-display">1</span>
      </div>
      <div class="hud-pill">
        <i class="fa-solid fa-coins"></i> <span id="coin-display">0</span>
      </div>
    </div>

    <!-- SPEED DASHBOARD -->
    <div class="dashboard">
      <div class="speed-val" id="speed-display">0</div>
      <div class="speed-unit">KM / H</div>
    </div>

    <!-- TOUCH CONTROLS -->
    <div class="controls-container">
      <!-- Left / Right Steering -->
      <div class="control-group">
        <div class="ctrl-btn" id="btn-left"><i class="fa-solid fa-arrow-left"></i></div>
        <div class="ctrl-btn" id="btn-right"><i class="fa-solid fa-arrow-right"></i></div>
      </div>

      <!-- Horn Center-ish -->
      <div class="control-group">
        <div class="ctrl-btn btn-horn" id="btn-horn"><i class="fa-solid fa-bullhorn"></i></div>
      </div>

      <!-- Brake & Accelerator -->
      <div class="control-group">
        <div class="ctrl-btn btn-brake" id="btn-brake"><i class="fa-solid fa-ban"></i></div>
        <div class="ctrl-btn btn-accel" id="btn-accel"><i class="fa-solid fa-gas-pump"></i></div>
      </div>
    </div>
  </div>

  <!-- LEVEL UP POPUP MODAL -->
  <div id="level-modal">
    <div class="modal-card">
      <i class="fa-solid fa-trophy" style="font-size: 50px; color: #f1c40f; margin-bottom: 15px;"></i>
      <h2>LEVEL COMPLETE!</h2>
      <p>Welcome Second Round AS Gaming!</p>
      <button class="continue-btn" onclick="closeLevelModal()">Next Level <i class="fa-solid fa-forward"></i></button>
    </div>
  </div>

  <!-- 3D CANVAS CONTAINER -->
  <canvas id="game-canvas"></canvas>

  <script>
    /* --- TELEGRAM WEBAPP INTEGRATION --- */
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    let playerName = "Driver";
    let totalCoins = 0;
    let currentLevel = 1;

    if (tg) {
      tg.expand();
      if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
        playerName = tg.initDataUnsafe.user.first_name || "Driver";
      }
    }
    
    document.getElementById("welcome-msg").innerText = "Welcome " + playerName + " to 3D Bangladesh Highway";
    document.getElementById("p-name").innerText = playerName;
    document.getElementById("p-coins").innerText = totalCoins;

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
      if(id) document.getElementById(id).classList.add('active-screen');
    }

    /* --- THREE.JS 3D ENGINE VARIABLES --- */
    let scene, camera, renderer;
    let busGroup, roadGroup, environmentGroup;
    let coinsArray = [], billboardsArray = [], sceneryObjects = [];
    
    // Physics & Controls State
    let speed = 0;
    const maxSpeed = 1.2;
    const accel = 0.015;
    const brakeDecel = 0.03;
    const friction = 0.008;
    let busX = 0;
    const roadWidthLimit = 4.8;
    
    let isAccel = false, isBrake = false, isLeft = false, isRight = false;
    let isGameRunning = false;
    let animationFrameId;

    /* --- INITIALIZE THREE.JS SCENE --- */
    function init3DScene() {
      const container = document.getElementById('game-canvas');
      
      // Scene setup
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x87ceeb); // Sky blue
      scene.fog = new THREE.FogExp2(0x87ceeb, 0.012);

      // Camera setup
      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      
      // Renderer setup
      renderer = new THREE.WebGLRenderer({ canvas: container, antialias: true, alpha: false });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      // Lights
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xfffaed, 0.8);
      dirLight.position.set(50, 80, 50);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 1024;
      dirLight.shadow.mapSize.height = 1024;
      scene.add(dirLight);

      // Groups
      roadGroup = new THREE.Group();
      environmentGroup = new THREE.Group();
      scene.add(roadGroup);
      scene.add(environmentGroup);

      // Create 3D Objects
      createRoadAndLandscape();
      createBus();
      spawnSceneryElements();

      window.addEventListener('resize', onWindowResize);
    }

    /* --- 1. BANGLADESHI / SAUDI BUS CREATION --- */
    function createBus() {
      busGroup = new THREE.Group();

      // Bus Body
      const bodyGeo = new THREE.BoxGeometry(2.2, 2.6, 7.5);
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0x00b894, roughness: 0.2, metalness: 0.1 });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.y = 1.6;
      body.castShadow = true;
      busGroup.add(body);

      // Colorful Bangladeshi Livery Roof Stripe
      const stripeGeo = new THREE.BoxGeometry(2.25, 0.4, 7.55);
      const stripeMat = new THREE.MeshStandardMaterial({ color: 0xe67e22 });
      const stripe = new THREE.Mesh(stripeGeo, stripeMat);
      stripe.position.y = 2.0;
      busGroup.add(stripe);

      // Windshield & Side Windows
      const glassMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1, metalness: 0.9 });
      
      // Front Windshield
      const frontGlass = new THREE.Mesh(new THREE.BoxGeometry(2.0, 1.0, 0.1), glassMat);
      frontGlass.position.set(0, 2.2, -3.71);
      busGroup.add(frontGlass);

      // Headlights
      const lightMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      const headL = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.25, 0.1), lightMat);
      headL.position.set(-0.8, 0.8, -3.76);
      const headR = headL.clone();
      headR.position.x = 0.8;
      busGroup.add(headL);
      busGroup.add(headR);

      // Side Mirrors
      const mirrorMat = new THREE.MeshStandardMaterial({ color: 0x2d3436 });
      const mirrorL = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.4, 0.3), mirrorMat);
      mirrorL.position.set(-1.25, 2.0, -3.4);
      const mirrorR = mirrorL.clone();
      mirrorR.position.x = 1.25;
      busGroup.add(mirrorL);
      busGroup.add(mirrorR);

      // Wheels
      const wheelGeo = new THREE.CylinderGeometry(0.55, 0.55, 0.4, 16);
      const wheelMat = new THREE.MeshStandardMaterial({ color: 0x1e272e, roughness: 0.8 });
      
      const positions = [
        [-1.0, 0.55, -2.2], [1.0, 0.55, -2.2],
        [-1.0, 0.55, 2.2], [1.0, 0.55, 2.2]
      ];

      positions.forEach(pos => {
        const wheel = new THREE.Mesh(wheelGeo, wheelMat);
        wheel.rotation.z = Math.PI / 2;
        wheel.position.set(...pos);
        wheel.castShadow = true;
        busGroup.add(wheel);
      });

      busGroup.position.set(0, 0, 0);
      scene.add(busGroup);
    }

    /* --- 2. ENVIRONMENT & ROAD LAYOUT --- */
    function createRoadAndLandscape() {
      // Endless Asphalt Road
      const roadGeo = new THREE.PlaneGeometry(12, 1000);
      const roadMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.8 });
      const road = new THREE.Mesh(roadGeo, roadMat);
      road.rotation.x = -Math.PI / 2;
      road.position.z = -450;
      road.receiveShadow = true;
      roadGroup.add(road);

      // Center Divider Lines
      for (let z = 0; z > -900; z -= 12) {
        const lineGeo = new THREE.PlaneGeometry(0.3, 5);
        const lineMat = new THREE.MeshBasicMaterial({ color: 0xf1c40f });
        const line = new THREE.Mesh(lineGeo, lineMat);
        line.rotation.x = -Math.PI / 2;
        line.position.set(0, 0.02, z);
        roadGroup.add(line);
      }

      // Grass Field Shoulders
      const grassGeo = new THREE.PlaneGeometry(300, 1000);
      const grassMat = new THREE.MeshStandardMaterial({ color: 0x27ae60, roughness: 0.9 });
      
      const grassLeft = new THREE.Mesh(grassGeo, grassMat);
      grassLeft.rotation.x = -Math.PI / 2;
      grassLeft.position.set(-156, -0.05, -450);
      grassLeft.receiveShadow = true;
      roadGroup.add(grassLeft);

      const grassRight = grassLeft.clone();
      grassRight.position.x = 156;
      roadGroup.add(grassRight);
    }

    /* --- 3. SCENERY: TREES, BAZAAR SHOPS & "AS GAME" BILLBOARDS --- */
    function spawnSceneryElements() {
      // Clear previous
      sceneryObjects.forEach(obj => scene.remove(obj));
      coinsArray.forEach(c => scene.remove(c));
      sceneryObjects = [];
      coinsArray = [];

      for (let z = -20; z > -800; z -= 25) {
        // Green Trees (Left & Right)
        createTree(-10 - Math.random() * 8, z);
        createTree(10 + Math.random() * 8, z);

        // Electric Poles
        if (z % 50 === 0) {
          createElectricPole(-7, z);
        }

        // Roadside Bazaars / Shops
        if (z % 120 === 0) {
          createShop(11, z);
        }

        // AS Game Billboard / Signboards
        if (z % 80 === 0) {
          createBillboard(-9, z);
        }

        // Coins along the road
        if (Math.random() < 0.6) {
          const coinGeo = new THREE.CylinderGeometry(0.6, 0.6, 0.15, 16);
          const coinMat = new THREE.MeshStandardMaterial({ color: 0xf1c40f, metalness: 0.8, roughness: 0.2 });
          const coin = new THREE.Mesh(coinGeo, coinMat);
          coin.rotation.x = Math.PI / 2;
          
          const lanes = [-2.5, 0, 2.5];
          const xPos = lanes[Math.floor(Math.random() * lanes.length)];
          coin.position.set(xPos, 1.0, z);
          scene.add(coin);
          coinsArray.push(coin);
        }
      }
    }

    function createTree(x, z) {
      const treeGroup = new THREE.Group();
      const trunkGeo = new THREE.CylinderGeometry(0.3, 0.5, 3);
      const trunkMat = new THREE.MeshStandardMaterial({ color: 0x784e2d });
      const trunk = new THREE.Mesh(trunkGeo, trunkMat);
      trunk.position.y = 1.5;

      const foliageGeo = new THREE.ConeGeometry(2.5, 5, 8);
      const foliageMat = new THREE.MeshStandardMaterial({ color: 0x1e824c, roughness: 0.6 });
      const foliage = new THREE.Mesh(foliageGeo, foliageMat);
      foliage.position.y = 4.5;

      treeGroup.add(trunk);
      treeGroup.add(foliage);
      treeGroup.position.set(x, 0, z);
      scene.add(treeGroup);
      sceneryObjects.push(treeGroup);
    }

    function createElectricPole(x, z) {
      const pole = new THREE.Group();
      const pGeo = new THREE.CylinderGeometry(0.12, 0.12, 8);
      const pMat = new THREE.MeshStandardMaterial({ color: 0x7f8c8d });
      const pMesh = new THREE.Mesh(pGeo, pMat);
      pMesh.position.y = 4;
      pole.add(pMesh);
      pole.position.set(x, 0, z);
      scene.add(pole);
      sceneryObjects.push(pole);
    }

    function createShop(x, z) {
      const shop = new THREE.Group();
      const baseGeo = new THREE.BoxGeometry(4, 3, 4);
      const baseMat = new THREE.MeshStandardMaterial({ color: 0xdfe6e9 });
      const base = new THREE.Mesh(baseGeo, baseMat);
      base.position.y = 1.5;

      const roofGeo = new THREE.ConeGeometry(3.5, 1.5, 4);
      const roofMat = new THREE.MeshStandardMaterial({ color: 0xd63031 });
      const roof = new THREE.Mesh(roofGeo, roofMat);
      roof.rotation.y = Math.PI / 4;
      roof.position.y = 3.75;

      shop.add(base);
      shop.add(roof);
      shop.position.set(x, 0, z);
      scene.add(shop);
      sceneryObjects.push(shop);
    }

    function createBillboard(x, z) {
      const board = new THREE.Group();
      
      // Stand
      const stand = new THREE.Mesh(
        new THREE.CylinderGeometry(0.15, 0.15, 5),
        new THREE.MeshStandardMaterial({ color: 0x2c3e50 })
      );
      stand.position.y = 2.5;

      // Banner Canvas Texture
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#f1c40f';
      ctx.fillRect(0, 0, 256, 128);
      ctx.fillStyle = '#000000';
      ctx.font = 'bold 36px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('AS GAME', 128, 55);
      ctx.font = 'bold 20px Arial';
      ctx.fillText('WELCOME!', 128, 95);

      const texture = new THREE.CanvasTexture(canvas);
      const bannerGeo = new THREE.BoxGeometry(4, 2, 0.2);
      const bannerMat = new THREE.MeshBasicMaterial({ map: texture });
      const banner = new THREE.Mesh(bannerGeo, bannerMat);
      banner.position.y = 4.5;

      board.add(stand);
      board.add(banner);
      board.position.set(x, 0, z);
      scene.add(board);
      sceneryObjects.push(board);
    }

    /* --- GAME LOOP & PHYSICS ENGINE --- */
    function updateGameLogic() {
      if (!isGameRunning) return;

      // Speed acceleration & braking
      if (isAccel) {
        speed = Math.min(speed + accel, maxSpeed);
      } else if (isBrake) {
        speed = Math.max(speed - brakeDecel, 0);
      } else {
        speed = Math.max(speed - friction, 0);
      }

      // Steering
      if (isLeft && busX > -roadWidthLimit) {
        busX -= 0.08 * (speed + 0.2);
      }
      if (isRight && busX < roadWidthLimit) {
        busX += 0.08 * (speed + 0.2);
      }

      // Move Bus horizontally
      busGroup.position.x = busX;
      busGroup.rotation.y = isLeft ? 0.05 : isRight ? -0.05 : 0;

      // Scroll World towards camera to simulate endless driving
      const moveDistance = speed * 1.5;
      
      sceneryObjects.forEach(obj => {
        obj.position.z += moveDistance;
        if (obj.position.z > 20) obj.position.z -= 780;
      });

      // Update Coins
      coinsArray.forEach((coin, index) => {
        coin.rotation.z += 0.05;
        coin.position.z += moveDistance;

        // Collision Check with Bus
        const dist = Math.hypot(coin.position.x - busGroup.position.x, coin.position.z - busGroup.position.z);
        if (dist < 1.8 && coin.position.z > -2 && coin.position.z < 2) {
          totalCoins += 10;
          document.getElementById('coin-display').innerText = totalCoins;
          document.getElementById('p-coins').innerText = totalCoins;
          scene.remove(coin);
          coinsArray.splice(index, 1);

          // Level Progression Trigger
          if (totalCoins > 0 && totalCoins % 100 === 0) {
            triggerLevelUp();
          }
        }

        // Recycle coin
        if (coin.position.z > 20) {
          coin.position.z -= 780;
        }
      });

      // Camera Smooth Follow Behind Bus
      camera.position.x = busGroup.position.x * 0.6;
      camera.position.y = busGroup.position.y + 4.5;
      camera.position.z = busGroup.position.z + 9.5;
      camera.lookAt(busGroup.position.x, busGroup.position.y + 1.8, busGroup.position.z - 10);

      // Update Speedometer UI
      const displayKm = Math.round(speed * 90);
      document.getElementById('speed-display').innerText = displayKm;

      // Render Three.js Scene
      renderer.render(scene, camera);

      animationFrameId = requestAnimationFrame(updateGameLogic);
    }

    /* --- LEVEL PROGRESSION MODAL --- */
    function triggerLevelUp() {
      isGameRunning = false;
      currentLevel++;
      document.getElementById('level-display').innerText = currentLevel;
      document.getElementById('level-modal').style.display = 'flex';
    }

    function closeLevelModal() {
      document.getElementById('level-modal').style.display = 'none';
      isGameRunning = true;
      updateGameLogic();
    }

    /* --- CONTROLS SETUP --- */
    function setupControls() {
      const bindTouch = (id, startCB, endCB) => {
        const el = document.getElementById(id);
        el.addEventListener('touchstart', (e) => { e.preventDefault(); startCB(); });
        el.addEventListener('touchend', (e) => { e.preventDefault(); endCB(); });
        el.addEventListener('mousedown', startCB);
        el.addEventListener('mouseup', endCB);
      };

      bindTouch('btn-left', () => isLeft = true, () => isLeft = false);
      bindTouch('btn-right', () => isRight = true, () => isRight = false);
      bindTouch('btn-accel', () => isAccel = true, () => isAccel = false);
      bindTouch('btn-brake', () => isBrake = true, () => isBrake = false);

      document.getElementById('btn-horn').onclick = () => {
        // Simple Horn Visual Feedback
        document.getElementById('btn-horn').classList.add('active');
        setTimeout(() => document.getElementById('btn-horn').classList.remove('active'), 300);
      };

      // Keyboard Controls Fallback
      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'a') isLeft = true;
        if (e.key === 'ArrowRight' || e.key === 'd') isRight = true;
        if (e.key === 'ArrowUp' || e.key === 'w') isAccel = true;
        if (e.key === 'ArrowDown' || e.key === 's') isBrake = true;
      });
      window.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'a') isLeft = false;
        if (e.key === 'ArrowRight' || e.key === 'd') isRight = false;
        if (e.key === 'ArrowUp' || e.key === 'w') isAccel = false;
        if (e.key === 'ArrowDown' || e.key === 's') isBrake = false;
      });
    }

    function onWindowResize() {
      if (!camera || !renderer) return;
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    /* --- GAME LIFECYCLE --- */
    function startBusGame() {
      showScreen('game-screen');
      if (!scene) {
        init3DScene();
        setupControls();
      }
      isGameRunning = true;
      updateGameLogic();
    }

    function exitToMenu() {
      isGameRunning = false;
      cancelAnimationFrame(animationFrameId);
      showScreen('main-menu');
    }
  </script>
</body>
</html>
