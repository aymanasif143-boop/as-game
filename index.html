<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AS Gaming - Hill Climb</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Impact', 'Arial Black', sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #111; }
        
        #game-container { position: relative; width: 100vw; height: 100vh; background: #87CEEB; }
        canvas { display: block; width: 100%; height: 100%; }

        /* UI Screens */
        .overlay-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 50; }
        
        /* Splash Screen */
        #splash-screen { background: #0a0a0a; color: #fff; animation: fadeOut 0.5s 2s forwards; }
        .logo-box { background: linear-gradient(45deg, #ff0055, #ff5500); padding: 20px 40px; border-radius: 20px; box-shadow: 0 0 30px #ff5500; text-align: center; }
        
        /* Main Menu */
        #main-menu { background: linear-gradient(180deg, #1e3c72 0%, #2a5298 100%); }
        .top-bar { position: absolute; top: 15px; left: 20px; right: 20px; display: flex; justify-content: space-between; z-index: 10; }
        .stat-card { background: rgba(0,0,0,0.6); border: 2px solid #ffd700; padding: 8px 20px; border-radius: 25px; color: #ffd700; font-size: 20px; }

        .menu-title { font-size: 48px; color: #fff; text-shadow: 3px 3px 0 #000, -2px -2px 0 #ff5500; margin-bottom: 10px; }
        .subtitle { font-size: 20px; color: #ffd700; margin-bottom: 30px; }

        .garage-view { width: 320px; height: 180px; background: rgba(255,255,255,0.1); border: 4px solid #fff; border-radius: 15px; display: flex; justify-content: center; align-items: center; position: relative; margin-bottom: 20px; }
        
        .btn { background: linear-gradient(0deg, #28a745, #34ce57); border: 3px solid #fff; border-radius: 12px; color: #fff; font-size: 24px; padding: 12px 40px; cursor: pointer; text-shadow: 2px 2px 0 #000; box-shadow: 0 6px 0 #1e7e34; }
        .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #1e7e34; }
        
        /* In-Game Controls */
        .controls { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: space-between; padding: 0 30px; z-index: 20; pointer-events: none; }
        .pedal { width: 90px; height: 110px; background: #333; border: 4px solid #aaa; border-radius: 15px; display: flex; justify-content: center; align-items: center; color: white; font-size: 18px; pointer-events: auto; touch-action: manipulation; box-shadow: 0 8px 0 #111; }
        .pedal:active { transform: translateY(4px); box-shadow: 0 4px 0 #111; }
        #btn-gas { background: linear-gradient(180deg, #28a745, #155724); border-color: #5cdb95; }
        #btn-brake { background: linear-gradient(180deg, #dc3545, #721c24); border-color: #ff7b89; }

        #game-hud { position: absolute; top: 15px; left: 15px; z-index: 20; pointer-events: none; color: white; font-size: 24px; text-shadow: 2px 2px 0 #000; }
        
        /* Game Over */
        #game-over { background: rgba(0,0,0,0.85); display: none; }
        .go-title { color: #ff3333; font-size: 50px; text-shadow: 3px 3px 0 #000; margin-bottom: 15px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body>

<div id="game-container">
    <!-- Splash Screen -->
    <div id="splash-screen" class="overlay-screen">
        <div class="logo-box">
            <h1 style="font-size: 42px; color: #fff;">AS GAMING</h1>
            <p style="color: #ffd700; margin-top: 5px;">WELCOME</p>
        </div>
    </div>

    <!-- Main Menu -->
    <div id="main-menu" class="overlay-screen" style="display: none;">
        <div class="top-bar">
            <div class="stat-card">🪙 <span id="menu-coins">0</span></div>
            <div class="stat-card" style="border-color: #00ffff; color: #00ffff;">AS PLAY</div>
        </div>

        <h1 class="menu-title">AS CAR PLAYING</h1>
        <div class="subtitle">HILL CLIMB EDITION</div>

        <div class="garage-view">
            <div style="font-size: 70px;">🚜</div>
            <div style="position: absolute; bottom: 10px; background: #ff5500; color: #fff; padding: 2px 10px; border-radius: 5px; font-size: 14px;">AS MONSTER</div>
        </div>

        <button class="btn" onclick="startGame()">START GAME 🏁</button>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over" class="overlay-screen">
        <h1 class="go-title">DRIVER DOWN! 💥</h1>
        <p style="color: #fff; font-size: 22px; margin-bottom: 20px;">Score: <span id="final-dist">0</span>m</p>
        <button class="btn" onclick="restartGame()">RETRY 🔄</button>
    </div>

    <!-- HUD -->
    <div id="game-hud">
        <div>🚩 <span id="dist-val">0</span>m</div>
        <div style="color: #ffd700; margin-top: 5px;">🪙 <span id="coin-val">0</span></div>
    </div>

    <!-- Controls -->
    <div class="controls">
        <div id="btn-brake" class="pedal">BRAKE</div>
        <div id="btn-gas" class="pedal">GAS</div>
    </div>

    <canvas id="canvas"></canvas>
</div>

<script>
    // Matter.js Aliases
    const { Engine, Render, Runner, Bodies, Composite, Body, Constraint, Vector } = Matter;

    let engine, world, render, runner;
    let car, rearWheel, frontWheel;
    let coins = [];
    let scoreCoins = 0, distance = 0;
    let isGameOver = false, isPlaying = false;
    let gasPressed = false, brakePressed = false;

    const canvas = document.getElementById('canvas');

    function init() {
        setTimeout(() => {
            document.getElementById('splash-screen').style.display = 'none';
            document.getElementById('main-menu').style.display = 'flex';
        }, 2200);

        setupPhysics();
        setupInput();
    }

    function setupPhysics() {
        engine = Engine.create();
        world = engine.world;

        render = Render.create({
            canvas: canvas,
            engine: engine,
            options: {
                width: window.innerWidth,
                height: window.innerHeight,
                wireframes: false,
                background: '#70c5ce'
            }
        });

        Render.run(render);
        runner = Runner.create();
        Runner.run(runner, engine);
    }

    function createTerrainAndCar() {
        Composite.clear(world);

        // Generate Hills (Terrain)
        const terrainPoints = [];
        let startX = -500;
        let startY = window.innerHeight - 150;
        
        for (let i = 0; i < 200; i++) {
            startX += 80;
            startY += Math.sin(i * 0.3) * 40 + (Math.random() * 10 - 5);
            terrainPoints.push({ x: startX, y: startY });
        }

        for (let i = 0; i < terrainPoints.length - 1; i++) {
            const p1 = terrainPoints[i];
            const p2 = terrainPoints[i+1];
            const midX = (p1.x + p2.x) / 2;
            const midY = (p1.y + p2.y) / 2;
            const len = Math.hypot(p2.x - p1.x, p2.y - p1.y);
            const angle = Math.atan2(p2.y - p1.y, p2.x - p1.x);

            const segment = Bodies.rectangle(midX, midY, len + 5, 40, {
                isStatic: true,
                friction: 0.9,
                render: { fillStyle: '#5d4037' }
            });
            Body.setAngle(segment, angle);
            Composite.add(world, segment);

            // Add Coins along path
            if (i % 3 === 0 && i > 5) {
                const coin = Bodies.circle(midX, midY - 50, 12, {
                    isStatic: true,
                    isSensor: true,
                    render: { fillStyle: '#ffd700' }
                });
                coins.push(coin);
                Composite.add(world, coin);
            }
        }

        // Build AS Car
        const carX = 100, carY = 200;
        car = Bodies.rectangle(carX, carY, 140, 40, {
            density: 0.005,
            friction: 0.4,
            render: { fillStyle: '#ff5500' } // Orange color theme
        });

        // Wheels
        rearWheel = Bodies.circle(carX - 45, carY + 30, 26, { friction: 0.9, density: 0.01, render: { fillStyle: '#222' } });
        frontWheel = Bodies.circle(carX + 45, carY + 30, 26, { friction: 0.9, density: 0.01, render: { fillStyle: '#222' } });

        // Axles
        const axle1 = Constraint.create({
            bodyA: car, pointB: { x: -45, y: 30 }, bodyB: rearWheel, stiffness: 0.4, length: 0
        });
        const axle2 = Constraint.create({
            bodyA: car, pointB: { x: 45, y: 30 }, bodyB: frontWheel, stiffness: 0.4, length: 0
        });

        Composite.add(world, [car, rearWheel, frontWheel, axle1, axle2]);
    }

    function setupInput() {
        const gasBtn = document.getElementById('btn-gas');
        const brakeBtn = document.getElementById('btn-brake');

        const bindTouch = (elem, pressFn, releaseFn) => {
            elem.addEventListener('touchstart', (e) => { e.preventDefault(); pressFn(); });
            elem.addEventListener('touchend', (e) => { e.preventDefault(); releaseFn(); });
            elem.addEventListener('mousedown', pressFn);
            elem.addEventListener('mouseup', releaseFn);
        };

        bindTouch(gasBtn, () => gasPressed = true, () => gasPressed = false);
        bindTouch(brakeBtn, () => brakePressed = true, () => brakePressed = false);

        // Custom render for "AS" text on Car Body
        Events.on(render, 'afterRender', () => {
            if (!isPlaying || !car) return;
            const ctx = render.context;
            const pos = car.position;
            const angle = car.angle;

            ctx.save();
            ctx.translate(pos.x, pos.y);
            ctx.rotate(angle);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 22px Impact';
            ctx.fillText('AS', -12, 5);
            ctx.restore();

            // Camera follow car
            Render.lookAt(render, car, { x: 300, y: 200 });
        });

        // Game Loop Updates
        Events.on(engine, 'beforeUpdate', () => {
            if (!isPlaying || isGameOver) return;

            if (gasPressed) {
                Body.setAngularVelocity(rearWheel, 0.25);
                Body.setAngularVelocity(frontWheel, 0.25);
            }
            if (brakePressed) {
                Body.setAngularVelocity(rearWheel, -0.15);
                Body.setAngularVelocity(frontWheel, -0.15);
            }

            // Distance calculation
            distance = Math.max(0, Math.floor((car.position.x - 100) / 10));
            document.getElementById('dist-val').innerText = distance;

            // Driver Down Check (Flipped Over)
            const rot = Math.abs(car.angle % (Math.PI * 2));
            if ((rot > 1.6 && rot < 4.7) && Math.abs(car.velocity.y) < 0.5) {
                triggerGameOver();
            }

            // Coin collection check
            coins.forEach((coin, idx) => {
                if (Vector.magnitude(Vector.sub(car.position, coin.position)) < 50) {
                    Composite.remove(world, coin);
                    coins.splice(idx, 1);
                    scoreCoins += 10;
                    document.getElementById('coin-val').innerText = scoreCoins;
                }
            });
        });
    }

    function startGame() {
        document.getElementById('main-menu').style.display = 'none';
        document.getElementById('game-over').style.display = 'none';
        scoreCoins = 0; distance = 0;
        isGameOver = false; isPlaying = true;
        createTerrainAndCar();
    }

    function triggerGameOver() {
        isGameOver = true;
        isPlaying = false;
        document.getElementById('final-dist').innerText = distance;
        document.getElementById('game-over').style.display = 'flex';
        document.getElementById('menu-coins').innerText = scoreCoins;
    }

    function restartGame() {
        startGame();
    }

    window.onload = init;
</script>
</body>
</html>
