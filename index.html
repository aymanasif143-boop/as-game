<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AS Reebook - Social & Messenger</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f0f2f5;
            color: #333;
        }
        /* Auth Screens */
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #1877f2, #3b5998);
        }
        .auth-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        .auth-card h2 {
            color: #1877f2;
            margin-bottom: 20px;
            font-size: 28px;
        }
        .auth-card input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
        }
        .auth-card button {
            width: 100%;
            padding: 12px;
            background-color: #1877f2;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .auth-card button:hover {
            background-color: #166fe5;
        }
        .switch-text {
            font-size: 14px;
            color: #1877f2;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Main App Screen */
        #app-screen {
            display: none;
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            min-height: 100vh;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
            padding-bottom: 60px;
        }
        header {
            background: #1877f2;
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        header h1 {
            font-size: 22px;
        }
        .nav-buttons {
            display: flex;
            gap: 10px;
        }
        .nav-buttons button {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .nav-buttons button.active {
            background: white;
            color: #1877f2;
        }

        /* Tab Contents */
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }

        /* Feed Section */
        .create-post {
            padding: 15px;
            border-bottom: 8px solid #f0f2f5;
        }
        .create-post textarea {
            width: 100%;
            border: none;
            resize: none;
            padding: 10px;
            font-size: 16px;
            outline: none;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .post-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .file-upload-label {
            cursor: pointer;
            color: #1877f2;
            font-weight: 600;
            font-size: 14px;
        }
        .create-post button.post-btn {
            background: #1877f2;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .post-card {
            background: white;
            border-bottom: 1px solid #e4e6eb;
            padding: 15px;
            margin-bottom: 10px;
        }
        .post-header {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        .avatar {
            width: 40px;
            height: 40px;
            background: #1877f2;
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            margin-right: 10px;
        }
        .post-author {
            font-weight: bold;
            font-size: 15px;
        }
        .post-time {
            font-size: 12px;
            color: #65676b;
        }
        .post-content {
            font-size: 15px;
            margin-bottom: 10px;
            line-height: 1.5;
            word-break: break-word;
        }
        .post-media {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            border-radius: 8px;
            margin-top: 5px;
        }

        /* Messenger & Call UI */
        .messenger-container, .users-list-container {
            padding: 15px;
        }
        .user-list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #eee;
            background: #f9f9f9;
            margin-bottom: 8px;
            border-radius: 8px;
        }
        .chat-box {
            display: none;
            flex-direction: column;
            height: 75vh;
        }
        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: #e4e6eb;
            border-radius: 8px 8px 0 0;
        }
        .call-btn-group {
            display: flex;
            gap: 8px;
        }
        .call-btn-group button {
            background: #1877f2;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        .chat-messages {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            background: #fff;
            border: 1px solid #e4e6eb;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .message {
            max-width: 70%;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 14px;
            word-break: break-word;
        }
        .message.sent {
            background: #1877f2;
            color: white;
            align-self: flex-end;
        }
        .message.received {
            background: #e4e6eb;
            color: #333;
            align-self: flex-start;
        }
        .chat-input-area {
            display: flex;
            padding: 10px;
            background: #f0f2f5;
            border-radius: 0 0 8px 8px;
        }
        .chat-input-area input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            outline: none;
        }
        .chat-input-area button {
            background: #1877f2;
            color: white;
            border: none;
            padding: 0 15px;
            margin-left: 5px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Call Simulation Modal */
        #call-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: white;
        }
        .call-avatar {
            width: 100px; height: 100px;
            background: #1877f2;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .end-call-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 30px;
        }
    </style>
</head>
<body>

    <!-- Register Screen -->
    <div id="register-screen" class="auth-container">
        <div class="auth-card">
            <h2>AS Reebook</h2>
            <p style="margin-bottom: 15px; color: #65676b; font-size: 14px;">নতুন অ্যাকাউন্ট তৈরি করুন</p>
            <input type="text" id="reg-name" placeholder="আপনার পূর্ণ নাম...">
            <input type="text" id="reg-username" placeholder="ইউজারনেম (যেমন: asif007)...">
            <input type="text" id="reg-phone" placeholder="মোবাইল নম্বর...">
            <input type="password" id="reg-pass" placeholder="পাসওয়ার্ড...">
            <button onclick="handleRegister()">রেজিস্ট্রেশন করুন</button>
            <div class="switch-text" onclick="showLogin()">আগে থেকেই অ্যাকাউন্ট আছে? লগইন করুন</div>
        </div>
    </div>

    <!-- Login Screen -->
    <div id="login-screen" class="auth-container" style="display: none;">
        <div class="auth-card">
            <h2>AS Reebook</h2>
            <p style="margin-bottom: 15px; color: #65676b; font-size: 14px;">নম্বর ও পাসওয়ার্ড দিয়ে লগইন করুন</p>
            <input type="text" id="login-phone" placeholder="মোবাইল নম্বর...">
            <input type="password" id="login-pass" placeholder="পাসওয়ার্ড...">
            <button onclick="handleLogin()">লগইন করুন</button>
            <div class="switch-text" onclick="showRegister()">অ্যাকাউন্ট নেই? রেজিস্ট্রেশন করুন</div>
        </div>
    </div>

    <!-- Main App Screen -->
    <div id="app-screen">
        <header>
            <h1>AS Reebook</h1>
            <div class="nav-buttons">
                <button id="nav-feed" class="active" onclick="switchTab('feed')">ফিড</button>
                <button id="nav-chat" onclick="switchTab('chat')">মেসেঞ্জার</button>
                <button onclick="handleLogout()" style="background:#dc3545;">লগআউট</button>
            </div>
        </header>

        <!-- Feed Tab -->
        <div id="tab-feed" class="tab-content active">
            <div class="create-post">
                <textarea id="post-text" rows="3" placeholder="আজ মনে কি চলছে? ছবি বা ভিডিওসহ শেয়ার করুন..."></textarea>
                <div class="post-actions">
                    <label class="file-upload-label">
                        📁 ছবি/ভিডিও জুড়ুন
                        <input type="file" id="media-file" accept="image/*,video/*" style="display: none;" onchange="previewMedia()">
                    </label>
                    <button class="post-btn" onclick="createPost()">পোস্ট করুন</button>
                </div>
                <div id="file-name-display" style="font-size: 12px; color: #65676b; margin-top: 5px;"></div>
            </div>
            <div class="feed" id="feed-container"></div>
        </div>

        <!-- Messenger Tab -->
        <div id="tab-chat" class="tab-content">
            <div id="users-list-view" class="users-list-container">
                <h3 style="margin-bottom: 15px; color: #1877f2;">অন্যান্য ইউজারদের সাথে চ্যাট করুন</h3>
                <div id="other-users-container"></div>
            </div>

            <div id="chat-box-view" class="chat-box">
                <div class="chat-header">
                    <div>
                        <button onclick="backToUserList()" style="border:none; background:none; font-weight:bold; cursor:pointer; color:#1877f2; margin-right:10px;">← ব্যাক</button>
                        <span id="chat-target-name" style="font-weight: bold;"></span>
                    </div>
                    <div class="call-btn-group">
                        <button onclick="startCall('audio')">📞 অডিও কল</button>
                        <button onclick="startCall('video')">📹 ভিডিও কল</button>
                    </div>
                </div>
                <div class="chat-messages" id="chat-messages-container"></div>
                <div class="chat-input-area">
                    <input type="text" id="chat-input-text" placeholder="মেসেজ লিখুন...">
                    <button onclick="sendChatMessage()">সেন্ড</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Call Simulation Modal -->
    <div id="call-modal">
        <div class="call-avatar" id="call-modal-avatar">A</div>
        <h2 id="call-status-text">কল হচ্ছে...</h2>
        <p id="call-target-display" style="margin-top: 10px; color: #ccc;"></p>
        <button class="end-call-btn" onclick="endCall()">কল কেটে দিন</button>
    </div>

    <script>
        let currentUser = null;
        let activeChatUser = null;

        function showLogin() {
            document.getElementById("register-screen").style.display = "none";
            document.getElementById("login-screen").style.display = "flex";
        }

        function showRegister() {
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("register-screen").style.display = "flex";
        }

        function handleRegister() {
            const name = document.getElementById("reg-name").value.trim();
            const username = document.getElementById("reg-username").value.trim();
            const phone = document.getElementById("reg-phone").value.trim();
            const pass = document.getElementById("reg-pass").value.trim();

            if(!name || !username || !phone || !pass) {
                alert("সবগুলো ঘর পূরণ করুন!");
                return;
            }

            let users = JSON.parse(localStorage.getItem("as_reebook_users") || "[]");
            if(users.some(u => u.phone === phone)) {
                alert("এই নম্বর দিয়ে ইতিমধ্যে অ্যাকাউন্ট খোলা আছে!");
                return;
            }
            if(users.some(u => u.username === username)) {
                alert("এই ইউজারনেমটি অন্য কেউ ব্যবহার করছে, অন্যটি দিন!");
                return;
            }

            users.push({ name, username, phone, pass });
            localStorage.setItem("as_reebook_users", JSON.stringify(users));
            alert("রেজিস্ট্রেশন সফল হয়েছে! এখন লগইন করুন।");
            showLogin();
        }

        function handleLogin() {
            const phone = document.getElementById("login-phone").value.trim();
            const pass = document.getElementById("login-pass").value.trim();

            let users = JSON.parse(localStorage.getItem("as_reebook_users") || "[]");
            let validUser = users.find(u => u.phone === phone && u.pass === pass);

            if(!validUser) {
                alert("নম্বর অথবা পাসওয়ার্ড ভুল হয়েছে!");
                return;
            }

            currentUser = validUser;
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("app-screen").style.display = "block";
            loadPosts();
        }

        function handleLogout() {
            currentUser = null;
            document.getElementById("app-screen").style.display = "none";
            document.getElementById("login-screen").style.display = "flex";
        }

        function switchTab(tab) {
            document.getElementById("tab-feed").classList.remove("active");
            document.getElementById("tab-chat").classList.remove("active");
            document.getElementById("nav-feed").classList.remove("active");
            document.getElementById("nav-chat").classList.remove("active");

            if(tab === 'feed') {
                document.getElementById("tab-feed").classList.add("active");
                document.getElementById("nav-feed").classList.add("active");
                loadPosts();
            } else {
                document.getElementById("tab-chat").classList.add("active");
                document.getElementById("nav-chat").classList.add("active");
                loadUsersList();
            }
        }

        let selectedMediaUrl = "";
        let selectedMediaType = "";

        function previewMedia() {
            const fileInput = document.getElementById("media-file");
            if (fileInput.files && fileInput.files[0]) {
                const file = fileInput.files[0];
                document.getElementById("file-name-display").innerText = "সিলেক্ট করা ফাইল: " + file.name;
                const reader = new FileReader();
                reader.onload = function(e) {
                    selectedMediaUrl = e.target.result;
                    selectedMediaType = file.type.startsWith('video') ? 'video' : 'image';
                }
                reader.readAsDataURL(file);
            }
        }

        function createPost() {
            const text = document.getElementById("post-text").value.trim();
            if(!text && !selectedMediaUrl) {
                alert("কিছু লিখুন অথবা ছবি/ভিডিও সিলেক্ট করুন!");
                return;
            }

            const posts = JSON.parse(localStorage.getItem("as_reebook_posts") || "[]");
            posts.unshift({
                author: currentUser.name,
                username: currentUser.username,
                text: text,
                mediaUrl: selectedMediaUrl,
                mediaType: selectedMediaType,
                time: "এইমাত্র"
            });
            localStorage.setItem("as_reebook_posts", JSON.stringify(posts));

            document.getElementById("post-text").value = "";
            document.getElementById("media-file").value = "";
            document.getElementById("file-name-display").innerText = "";
            selectedMediaUrl = "";
            selectedMediaType = "";
            loadPosts();
        }

        function loadPosts() {
            const feedContainer = document.getElementById("feed-container");
            const posts = JSON.parse(localStorage.getItem("as_reebook_posts") || "[]");
            
            if(posts.length === 0) {
                feedContainer.innerHTML = '<p style="text-align:center; color:#65676b; margin-top:20px;">এখনো কোনো পোস্ট নেই।</p>';
                return;
            }

            let html = "";
            posts.forEach(post => {
                let mediaHtml = post.mediaUrl ? (post.mediaType === 'video' ? `<video src="${post.mediaUrl}" controls class="post-media"></video>` : `<img src="${post.mediaUrl}" class="post-media">`) : "";
                html += `
                    <div class="post-card">
                        <div class="post-header">
                            <div class="avatar">${post.author.charAt(0).toUpperCase()}</div>
                            <div>
                                <div class="post-author">${post.author} <span style="font-size:12px; color:#65676b; font-weight:normal;">@${post.username}</span></div>
                                <div class="post-time">${post.time}</div>
                            </div>
                        </div>
                        <div class="post-content">${post.text}</div>
                        ${mediaHtml}
                    </div>
                `;
            });
            feedContainer.innerHTML = html;
        }

        function loadUsersList() {
            const users = JSON.parse(localStorage.getItem("as_reebook_users") || "[]");
            const container = document.getElementById("other-users-container");
            
            let html = "";
            users.forEach(u => {
                if(u.username !== currentUser.username) {
                    html += `
                        <div class="user-list-item">
                            <div>
                                <strong>${u.name}</strong>
                                <div style="font-size:12px; color:#65676b;">@${u.username}</div>
                            </div>
                            <button onclick="openChat('${u.username}', '${u.name}')" style="background:#1877f2; color:white; border:none; padding:6px 12px; border-radius:4px; cursor:pointer;">মেসেজ দিন</button>
                        </div>
                    `;
                }
            });
            container.innerHTML = html || '<p style="text-align:center; color:#65676b;">অন্য কোনো ইউজার নেই।</p>';
            document.getElementById("users-list-view").style.display = "block";
            document.getElementById("chat-box-view").style.display = "none";
        }

        function openChat(username, name) {
            activeChatUser = { username, name };
            document.getElementById("chat-target-name").innerText = name;
            document.getElementById("users-list-view").style.display = "none";
            document.getElementById("chat-box-view").style.display = "flex";
            loadChatMessages();
        }

        function backToUserList() {
            activeChatUser = null;
            document.getElementById("chat-box-view").style.display = "none";
            document.getElementById("users-list-view").style.display = "block";
        }

        function sendChatMessage() {
            const text = document.getElementById("chat-input-text").value.trim();
            if(!text) return;

            const chats = JSON.parse(localStorage.getItem("as_reebook_chats") || "[]");
            chats.push({
                sender: currentUser.username,
                receiver: activeChatUser.username,
                text: text
            });
            localStorage.setItem("as_reebook_chats", JSON.stringify(chats));

            document.getElementById("chat-input-text").value = "";
            loadChatMessages();
        }

        function loadChatMessages() {
            const chats = JSON.parse(localStorage.getItem("as_reebook_chats") || "[]");
            const container = document.getElementById("chat-messages-container");
            
            let html = "";
            chats.forEach(c => {
                if((c.sender === currentUser.username && c.receiver === activeChatUser.username) || 
                   (c.sender === activeChatUser.username && c.receiver === currentUser.username)) {
                    let className = c.sender === currentUser.username ? "sent" : "received";
                    html += `<div class="message ${className}">${c.text}</div>`;
                }
            });
            container.innerHTML = html;
            container.scrollTop = container.scrollHeight;
        }

        function startCall(type) {
            const modal = document.getElementById("call-modal");
            document.getElementById("call-modal-avatar").innerText = activeChatUser.name.charAt(0);
            document.getElementById("call-status-text").innerText = type === 'video' ? "ভিডিও কল হচ্ছে..." : "অডিও কল হচ্ছে...";
            document.getElementById("call-target-display").innerText = activeChatUser.name;
            modal.style.display = "flex";
        }

        function endCall() {
            document.getElementById("call-modal").style.display = "none";
        }
    </script>
</body>
</html>
